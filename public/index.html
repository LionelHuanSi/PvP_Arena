<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PvP Arena</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <nav id="lang" class="lang" aria-label="Language"></nav>
    <h1><img src="/logo.svg" alt="" class="logo">PvP Arena</h1>
    <p id="conn" class="conn" hidden></p>

    <section id="lobby" hidden>
      <label><span data-i18n="yourName"></span>
        <input id="name" maxlength="20" data-i18n-ph="namePh">
      </label>

      <div class="box">
        <h2 data-i18n="create"></h2>
        <label><span data-i18n="game"></span>
          <select id="game"></select>
        </label>
        <label><span data-i18n="format"></span>
          <span class="bo"><span>BO</span><input id="bo" type="number" min="1" max="99" step="2" value="3"></span>
        </label>
        <div id="options"></div>
        <button id="create" data-i18n="create"></button>
      </div>

      <div class="box">
        <h2 data-i18n="join"></h2>
        <label><span data-i18n="roomCode"></span>
          <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" data-i18n-ph="codePh">
        </label>
        <button id="join" data-i18n="join"></button>
      </div>
    </section>

    <section id="room" hidden>
      <h2 id="room-game" class="subtitle"></h2>
      <div class="row">
        <span><span data-i18n="room"></span> <strong id="room-code"></strong> · <strong id="room-bo"></strong></span>
        <button id="copy" class="small" data-i18n="copyLink"></button>
      </div>
      <div id="players" class="players"></div>
      <p id="status" class="status"></p>
      <div id="board"></div>
      <div class="row">
        <button id="rematch" hidden></button>
        <button id="leave" class="small" data-i18n="leave"></button>
      </div>
    </section>

    <p id="error" class="error"></p>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
